name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    name: Swift tests and release structure
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test Core and PTP packages
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path FujiRecipesCore
          swift test --package-path FujiPTPClient

      - name: Build macOS package
        run: swift build --package-path macos

      - name: Check package scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh macos/package_app.sh

      - name: Build credential-free release package
        shell: bash
        run: |
          set -euo pipefail
          (
            cd macos
            ./package_app.sh release \
              --version 0.0.0 \
              --build-number "${GITHUB_RUN_NUMBER}"
          )
